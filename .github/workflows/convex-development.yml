name: Convex development bindings

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-development-bindings
  cancel-in-progress: false

jobs:
  codegen:
    # The environment's server-side branch policy restricts the secret to main.
    if: github.ref == 'refs/heads/main'
    environment: convex-development
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check bindings against development
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            dev:hardy-barracuda-115\|*) ;;
            *) echo "Expected the dedicated hardy-barracuda-115 development key" >&2; exit 1 ;;
          esac

          pnpm backend:codegen
          pnpm exec prettier --write packages/backend/convex/_generated

          git diff --exit-code -- packages/backend/convex/_generated
          untracked_bindings="$(git ls-files --others --exclude-standard -- packages/backend/convex/_generated)"
          if [ -n "$untracked_bindings" ]; then
            echo "New generated files must be committed:" >&2
            echo "$untracked_bindings" >&2
            exit 1
          fi
